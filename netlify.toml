# Monorepo deploy: build one site out of the npm workspace, publish its dist/.
# To deploy a different site, change the slug in both lines.

[build]
  command = "npm run build --workspace sites/espresso"
  publish = "sites/espresso/dist"

[build.environment]
  NODE_VERSION = "22"

# Frame sequences are content-addressed by name and never change in place:
# a visitor who returns should not re-download 13MB.
[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/posters/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
